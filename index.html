<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Students</title>
</head>
<body>

<h1>Študenti</h1>
<div id="mojd"></div>

<script>
const mojd = document.getElementById("mojd")

// štýly
mojd.style.display = "grid"
mojd.style.gridTemplateColumns = "repeat(4, 1fr)"
mojd.style.gap = "20px"
mojd.style.justifyItems = "center"

// efekty (len test)
setTimeout(() => {
    mojd.style.backgroundColor = "red"
}, 200)

setInterval(() => {
    mojd.style.backgroundColor = "yellow"
}, 200)

// FETCH na backend
fetch("https://fris-backand.onrender.com/students")
  .then(res => res.json())
  .then(data => {
    console.log(data)

    data.forEach((student) => {
        const card = document.createElement("div")
        card.style.textAlign = "center"

        const img = document.createElement("img")
        img.src = student.img || "https://via.placeholder.com/200"
        img.width = 200
        img.height = 220
        img.style.objectFit = "cover"
        img.style.borderRadius = "10px"

        const name = document.createElement("p")
        name.textContent = student.name + " " + student.surname

        card.appendChild(img)
        card.appendChild(name)

        mojd.appendChild(card)
    })
  })
  .catch(err => console.error("Chyba:", err))
</script>

</body>
</html>
