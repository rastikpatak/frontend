<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Students</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f9;
    margin: 0;
    padding: 20px;
}

h1 {
    text-align: center;
}

.form {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
}

.controls {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
}

input, select {
    padding: 8px;
    border-radius: 6px;
    border: 1px solid #ccc;
}

button {
    padding: 8px 12px;
    border: none;
    border-radius: 6px;
    background: #007bff;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #0056b3;
}

#mojd {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 20px;
}

.card {
    background: white;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    overflow: hidden;
    text-align: center;
    transition: 0.2s;
}

.card:hover {
    transform: translateY(-5px);
}

.card img {
    width: 100%;
    height: 220px;
    object-fit: cover;
}

.card-body {
    padding: 10px;
}

.name {
    font-weight: bold;
    margin-bottom: 5px;
}

.actions {
    margin-top: 10px;
}
</style>
</head>

<body>

<h1>Students</h1>

<div class="form">
    <input id="name" placeholder="Name">
    <input id="surname" placeholder="Surname">
    <input id="img" placeholder="Image URL">
    <button onclick="addStudent()">Add</button>
</div>

<div class="controls">
    <select id="sortBy" onchange="loadStudents()">
        <option value="id">Sort by ID</option>
        <option value="name">Sort by Name</option>
        <option value="surname">Sort by Surname</option>
    </select>

    <select id="orderBy" onchange="loadStudents()">
        <option value="asc">Ascending</option>
        <option value="desc">Descending</option>
    </select>
</div>

<div id="mojd"></div>

<script>
const API = "";
const mojd = document.getElementById("mojd");

function loadStudents() {
    const sort = document.getElementById("sortBy").value;
    const order = document.getElementById("orderBy").value;

    mojd.innerHTML = "";

    fetch(`${API}/students?sort=${sort}&order=${order}`)
        .then(res => res.json())
        .then(data => {
            data.forEach(s => {
                const card = document.createElement("div");
                card.className = "card";

                card.innerHTML = `
                    <img src="${s.img || 'https://via.placeholder.com/300'}" alt="student">
                    <div class="card-body">
                        <div class="name">${s.name} ${s.surname}</div>
                        <div class="actions">
                            <button onclick="deleteStudent(${s.id})">Delete</button>
                        </div>
                    </div>
                `;

                mojd.appendChild(card);
            });
        })
        .catch(err => console.error("Load error:", err));
}

function addStudent() {
    fetch(API + "/students", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            name: document.getElementById("name").value,
            surname: document.getElementById("surname").value,
            img: document.getElementById("img").value
        })
    })
    .then(() => loadStudents())
    .catch(err => console.error("Add error:", err));
}

function deleteStudent(id) {
    fetch(API + "/students/" + id, {
        method: "DELETE"
    })
    .then(() => loadStudents())
    .catch(err => console.error("Delete error:", err));
}

loadStudents();
</script>

</body>
</html>
