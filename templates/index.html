<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Students</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        /* FORM */
        .form {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }

        input {
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button {
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            background: #007bff;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        /* GRID */
        #mojd {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        /* CARD */
        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            padding: 10px;
            text-align: center;
            transition: 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 10px;
        }

        .name {
            font-weight: bold;
            margin-top: 10px;
        }

        .personality {
            color: gray;
            font-size: 14px;
        }

        .actions {
            margin-top: 10px;
        }

        /* CHAT BOX */
        #chatBox {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 300px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            display: none;
            flex-direction: column;
        }

        #messages {
            height: 200px;
            overflow-y: auto;
            padding: 10px;
            font-size: 14px;
        }

        #chatInput {
            display: flex;
        }

        #chatInput input {
            flex: 1;
            border: none;
            padding: 10px;
        }

        #chatInput button {
            border-radius: 0;
        }
    </style>
</head>
<body>

<h1>Students</h1>

<div class="form">
    <input id="name" placeholder="Name">
    <input id="surname" placeholder="Surname">
    <input id="personality" placeholder="Personality">
    <input id="img" placeholder="Image URL">
    <button onclick="addStudent()">Add</button>
</div>

<div id="mojd"></div>

<!-- CHAT -->
<div id="chatBox">
    <div id="messages"></div>
    <div id="chatInput">
        <input id="msgInput" placeholder="Message...">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
const API = "https://frontend-1-ppya.onrender.com"
const mojd = document.getElementById("mojd")

let currentUser = null

// LOAD
function loadStudents() {
    mojd.innerHTML = ""

    fetch(API + "/students")
    .then(res => res.json())
    .then(data => {
        data.forEach(s => {

            const card = document.createElement("div")
            card.className = "card"

            card.innerHTML = `
                <img src="${s.img || 'https://via.placeholder.com/200'}">
                <div class="name">${s.name} ${s.surname}</div>
                <div class="personality">${s.personality}</div>
                <div class="actions">
                    <button onclick="openChat('${s.name}', '${s.personality}')">Chat</button>
                    <button onclick="deleteStudent(${s.id})">Delete</button>
                </div>
            `

            mojd.appendChild(card)
        })
    })
}

// ADD
function addStudent() {
    fetch(API + "/students", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            name: name.value,
            surname: surname.value,
            personality: personality.value,
            img: img.value
        })
    }).then(loadStudents)
}

// DELETE
function deleteStudent(id) {
    fetch(API + "/students/" + id, {
        method: "DELETE"
    }).then(loadStudents)
}

// CHAT
function openChat(name, personality) {
    currentUser = {name, personality}
    document.getElementById("chatBox").style.display = "flex"
    document.getElementById("messages").innerHTML = ""
}

function sendMessage() {
    const input = document.getElementById("msgInput")
    const text = input.value

    if (!text) return

    addMessage("You: " + text)

    fetch(API + "/chat", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            name: currentUser.name,
            personality: currentUser.personality,
            message: text
        })
    })
    .then(res => res.json())
    .then(data => {
        addMessage(currentUser.name + ": " + data.reply)
    })

    input.value = ""
}

function addMessage(text) {
    const msg = document.createElement("div")
    msg.textContent = text
    document.getElementById("messages").appendChild(msg)
}

// INIT
loadStudents()
</script>

</body>
</html>
