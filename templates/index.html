<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Students</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f9;
    margin: 0;
    padding: 20px;
}

h1 {
    text-align: center;
}

/* FORM */
.form {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
}

input {
    padding: 8px;
    border-radius: 6px;
    border: 1px solid #ccc;
}

button {
    padding: 8px 12px;
    border: none;
    border-radius: 6px;
    background: #007bff;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #0056b3;
}

/* GRID */
#mojd {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 20px;
}

/* CARD */
.card {
    background: white;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    overflow: hidden;
    text-align: center;
    transition: 0.2s;
}

.card:hover {
    transform: translateY(-5px);
}

.card img {
    width: 100%;
    height: 220px;
    object-fit: cover;
}

.card-body {
    padding: 10px;
}

.name {
    font-weight: bold;
    margin-bottom: 5px;
}

.personality {
    color: gray;
    font-size: 14px;
}

.actions {
    margin-top: 10px;
}
</style>
</head>

<body>

<h1>Students</h1>

<div class="form">
    <input id="name" placeholder="Name">
    <input id="surname" placeholder="Surname">
    <input id="personality" placeholder="Personality">
    <input id="img" placeholder="Image URL">
    <button onclick="addStudent()">Add</button>
</div>

<div id="mojd"></div>

<script>
const API = "https://fris-backand.onrender.com"
const mojd = document.getElementById("mojd")

// LOAD STUDENTS
function loadStudents() {
    mojd.innerHTML = ""

    fetch(API + "/students")
    .then(res => res.json())
    .then(data => {

        data.forEach(s => {

            const card = document.createElement("div")
            card.className = "card"

            card.innerHTML = `
                <img src="${s.img || 'https://via.placeholder.com/300'}">

                <div class="card-body">
                    <div class="name">${s.name} ${s.surname}</div>
                    <div class="personality">${s.personality || ""}</div>

                    <div class="actions">
                        <button onclick="deleteStudent(${s.id})">Delete</button>
                    </div>
                </div>
            `

            mojd.appendChild(card)
        })
    })
}

// ADD
function addStudent() {
    fetch(API + "/students", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            name: document.getElementById("name").value,
            surname: document.getElementById("surname").value,
            personality: document.getElementById("personality").value,
            img: document.getElementById("img").value
        })
    })
    .then(() => loadStudents())
}

// DELETE
function deleteStudent(id) {
    fetch(API + "/students/" + id, {
        method: "DELETE"
    })
    .then(() => loadStudents())
}

// INIT
loadStudents()
</script>

</body>
</html>
